# Application Configuration
spring.application.name=SafeZone-AI-Backend
server.port=8080

# Logging
logging.level.com.safezone=DEBUG
logging.level.org.springframework.web=INFO

# Simulation Engine Configuration
# Options:
#   'mock'         - (Default) Uses canonical two-tank demo fixture
#   'java-sedov'   - Internal Java Sedov-Taylor blast shock wave physics model (alias: 'sedov')
#   'python-sedov' - Python-based wind-aware blast propagation engine (aliases: 'python', 'physics', 'sedov-python')
simulation.engine=mock

# Sedov-Taylor Blast Model Configuration (active when simulation.engine=sedov or java-sedov)
simulation.sedov.gamma=1.4
simulation.sedov.xi=1.033
simulation.sedov.polygon-points=36
simulation.sedov.threshold.critical-kpa=70.0
simulation.sedov.threshold.high-kpa=20.0
simulation.sedov.threshold.moderate-kpa=5.0

# Wind-Aware Hazard Propagation Configuration
simulation.sedov.wind.enabled=true
simulation.sedov.wind.influence=0.25
simulation.sedov.wind.reference-speed-mps=10.0
simulation.sedov.wind.max-factor=1.50
simulation.sedov.wind.min-factor=0.75

# Damage Assessment Consequence Layer Configuration
simulation.damage.overpressure.total-loss-kpa=70.0
simulation.damage.overpressure.structural-damage-kpa=20.0
simulation.damage.overpressure.minor-damage-kpa=5.0
simulation.damage.thermal.total-loss-kw-m2=37.5
simulation.damage.thermal.structural-damage-kw-m2=12.5
simulation.damage.thermal.minor-damage-kw-m2=4.0

# Domino Propagation Configuration
simulation.domino.escalation-threshold=0.25

# Escape Route Assessment Configuration
simulation.route.unsafe-overpressure-kpa=20.0
simulation.route.caution-overpressure-kpa=5.0
simulation.route.unsafe-thermal-kw-m2=12.5
simulation.route.caution-thermal-kw-m2=4.0

# Multi-Hazard Risk Scoring Configuration
simulation.risk.weight.assets=0.45
simulation.risk.weight.domino=0.35
simulation.risk.weight.routes=0.20
simulation.risk.threshold.critical=75.0
simulation.risk.threshold.high=50.0
simulation.risk.threshold.moderate=25.0

# Python Physics Engine Microservice Configuration (active when simulation.engine=python-sedov)
simulation.python.base-url=http://localhost:8000
simulation.python.connect-timeout-ms=2000
simulation.python.read-timeout-ms=10000
simulation.python.fallback-to-java=true

# External Physics Engine Legacy Configuration
simulation.physics.url=http://localhost:8000
simulation.physics.endpoint=/api/physics/simulate
simulation.physics.connect-timeout-ms=5000
simulation.physics.read-timeout-ms=30000




